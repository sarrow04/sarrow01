<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドーナツグラフ ジェネレーター</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #eceee6;
    --surface: #ffffff;
    --ink: #1c2620;
    --ink-soft: #6f7a70;
    --line: #d6dacd;
    --accent: #ff6b45;
    --accent-soft: rgba(255,107,69,0.10);
    --teal: #2f6f5e;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    padding:36px 18px 80px;
  }
  .wrap{ max-width:960px; margin:0 auto; }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:10px;
  }
  header h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .tag{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.08em;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1.25fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }

  .panel-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    margin:0 0 16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-title .n{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--ink);
    color:var(--bg);
    font-size:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
  }

  .title-field{ margin-bottom:18px; }
  .title-field label{
    display:block;
    font-size:10px;
    letter-spacing:.1em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .title-field input{
    width:100%;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
  }
  .title-field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  #rows{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .row{
    display:grid;
    /* 並び替えボタン用にカラム幅を調整 */
    grid-template-columns:20px 1fr 64px 26px 44px 22px;
    align-items:center;
    gap:6px;
    padding:7px 8px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .row .idx{ font-size:10px; color:var(--ink-soft); text-align:center; }
  .row input[type=text], .row input[type=number]{
    font-family:'JetBrains Mono', monospace;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:4px 2px;
    font-size:13px;
    color:var(--ink);
    width:100%;
  }
  .row input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .row .swatch{
    width:18px;height:18px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,0.2);
    cursor:pointer;
    padding:0;
    appearance:none;
    -webkit-appearance:none;
    background:none;
  }
  .row .swatch::-webkit-color-swatch-wrapper{ padding:0; }
  .row .swatch::-webkit-color-swatch{ border-radius:50%; border:none; }
  .row .del{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); font-size:15px; line-height:1;
  }
  .row .del:hover{ color:var(--accent); }

  .action-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .add-row, .sort-row {
    padding:10px;
    background:none;
    border:1.5px dashed var(--line);
    border-radius:8px;
    color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.06em;
    cursor:pointer;
  }
  .add-row { flex: 1; }
  .sort-row { padding: 10px 16px; }
  .add-row:hover, .sort-row:hover { border-color:var(--accent); color:var(--accent); }

  .field-label{ font-size:10px; color:var(--ink-soft); letter-spacing:.1em; margin-bottom:8px; display:block; }
  .palette-picks{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .pal-btn{
    border:1px solid var(--line);
    background:var(--bg);
    border-radius:8px;
    padding:6px 10px;
    font-size:10px;
    letter-spacing:.04em;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--ink-soft);
  }
  .pal-btn.active{ border-color:var(--ink); color:var(--ink); background:var(--surface); }
  .pal-dots{ display:flex; }
  .pal-dots i{ width:8px;height:8px;border-radius:50%;margin-left:-2px; display:inline-block; border:1px solid rgba(0,0,0,0.12); }

  .toggle-line{ display:flex; align-items:center; gap:18px; font-size:11px; color:var(--ink-soft); flex-wrap:wrap; }
  .toggle-line label{ display:flex; align-items:center; gap:6px; cursor:pointer; }

  #chartWrap{ 
    display:flex; 
    justify-content:center; 
    align-items:center;
    width: 100%;
    aspect-ratio: 1 / 1; 
    position:relative; 
    background-color: var(--surface);
  }
  canvas#chartCanvas{ 
    width:100%; 
    height:100%; 
    display:block; 
  }

  footer{
    text-align:center;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-top:36px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>ドーナツグラフ ジェネレーター</h1>
    <div class="tag">構成比を、直感的に。</div>
  </header>

  <div class="grid">

    <!-- LEFT: input -->
    <div class="card">
      <p class="panel-title"><span class="n">1</span>データを入力</p>

      <div class="title-field">
        <label>グラフタイトル（中央に表示）</label>
        <input type="text" id="chartTitle" placeholder="例）阿佐ヶ谷の成分">
      </div>

      <div id="rows"></div>
      
      <!-- ボタン並び -->
      <div class="action-row">
        <button class="add-row" id="addRowBtn">＋ 項目を追加</button>
        <button class="sort-row" id="sortBtn">↓ 多い順</button>
      </div>

      <div>
        <span class="field-label">配色</span>
        <div class="palette-picks" id="paletteRow"></div>
      </div>
      <div class="toggle-line">
        <label><input type="checkbox" id="showLabelChk" checked>項目名を表示</label>
        <label><input type="checkbox" id="showPercentChk" checked>％を表示</label>
        <label><input type="checkbox" id="showSubChk" checked>中央に合計を表示</label>
      </div>
    </div>

    <!-- RIGHT: chart -->
    <div class="card">
      <p class="panel-title"><span class="n">2</span>プレビュー</p>
      <div id="chartWrap">
        <canvas id="chartCanvas" width="560" height="560"></canvas>
      </div>
    </div>

  </div>

  <footer>データ探偵事務所 — 単一HTMLファイル / オフライン動作 / データはブラウザ内にのみ保存</footer>
</div>

<script>
var PALETTES = {
  "ember":  { name:"EMBER",   colors:["#ff6b45","#ffb26b","#2f6f5e","#1c2620","#c9a24b","#7a8f7f"] },
  "sage":   { name:"SAGE",    colors:["#2f6f5e","#7a9e8e","#c9a24b","#1c2620","#ff6b45","#9fb3a6"] },
  "cobalt": { name:"COBALT",  colors:["#2e4a72","#5b7fa6","#ff6b45","#1c2620","#8fa8c2","#c9a24b"] },
  "berry":  { name:"BERRY",   colors:["#8a3a5c","#c26b8a","#2f6f5e","#1c2620","#e0a4b8","#ff6b45"] },
  "mono":   { name:"MONO",    colors:["#1c2620","#465147","#6f7a70","#9aa495","#c3cbb8","#dfe3d5"] }
};

var state = {
  title: "",
  rows: [],
  paletteKey: "ember",
  showLabel: true,
  showPercent: true,
  showSub: true
};

// キャッシュをリセット
var STORE_KEY = "donutReportData_v7";

function uid(){ return Math.random().toString(36).slice(2,9); }

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && parsed.rows && parsed.rows.length){
        state.title = parsed.title || "";
        state.rows = parsed.rows;
        state.paletteKey = parsed.paletteKey || "ember";
        state.showLabel = parsed.showLabel !== false;
        state.showPercent = parsed.showPercent !== false;
        state.showSub = parsed.showSub !== false;
        return;
      }
    }
  }catch(e){}
  seedSample();
}

function seedSample(){
  state.title = "阿佐ヶ谷の成分";
  state.rows = [
    { id: uid(), label:"七夕祭り", value:40, color:null },
    { id: uid(), label:"パールセンター", value:25, color:null },
    { id: uid(), label:"神明宮", value:10, color:null },
    { id: uid(), label:"ジャズ", value:10, color:null },
    { id: uid(), label:"通過駅", value:10, color:null },
    { id: uid(), label:"飲み屋街", value:5, color:null }
  ];
}

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){}
}

function colorForIndex(i){
  var pal = PALETTES[state.paletteKey].colors;
  return pal[i % pal.length];
}

function renderRows(){
  var wrap = document.getElementById('rows');
  wrap.innerHTML = "";
  for(var i=0;i<state.rows.length;i++){
    (function(i){
      var r = state.rows[i];
      var div = document.createElement('div');
      div.className = 'row';

      var idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = String(i+1).padStart(2,'0');

      var labelInput = document.createElement('input');
      labelInput.type = 'text';
      labelInput.placeholder = '項目名';
      labelInput.value = r.label;
      labelInput.addEventListener('input', function(){
        r.label = labelInput.value;
        drawDonut();
        saveState();
      });

      var valInput = document.createElement('input');
      valInput.type = 'number';
      valInput.placeholder = '数値';
      valInput.value = r.value;
      valInput.min = 0;
      valInput.addEventListener('input', function(){
        r.value = parseFloat(valInput.value) || 0;
        drawDonut();
        saveState();
      });

      var colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.className = 'swatch';
      colorInput.value = r.color || colorForIndex(i);
      colorInput.addEventListener('input', function(){
        r.color = colorInput.value;
        drawDonut();
        saveState();
      });

      // 並び替えボタンのコンテナ
      var moveWrap = document.createElement('div');
      moveWrap.style.cssText = 'display:flex; gap:2px;';
      
      var upBtn = document.createElement('button');
      upBtn.textContent = '▲';
      upBtn.style.cssText = 'background:none; border:1px solid var(--line); border-radius:4px; font-size:9px; padding:4px 3px; cursor:pointer; color:var(--ink-soft);';
      upBtn.onclick = function() {
        if(i > 0) {
          var tmp = state.rows[i];
          state.rows[i] = state.rows[i-1];
          state.rows[i-1] = tmp;
          renderAll();
        }
      };

      var dnBtn = document.createElement('button');
      dnBtn.textContent = '▼';
      dnBtn.style.cssText = 'background:none; border:1px solid var(--line); border-radius:4px; font-size:9px; padding:4px 3px; cursor:pointer; color:var(--ink-soft);';
      dnBtn.onclick = function() {
        if(i < state.rows.length - 1) {
          var tmp = state.rows[i];
          state.rows[i] = state.rows[i+1];
          state.rows[i+1] = tmp;
          renderAll();
        }
      };

      moveWrap.appendChild(upBtn);
      moveWrap.appendChild(dnBtn);

      var delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', function(){
        state.rows.splice(i,1);
        renderAll();
      });

      div.appendChild(idx);
      div.appendChild(labelInput);
      div.appendChild(valInput);
      div.appendChild(colorInput);
      div.appendChild(moveWrap);
      div.appendChild(delBtn);
      wrap.appendChild(div);
    })(i);
  }
}

function renderPaletteRow(){
  var wrap = document.getElementById('paletteRow');
  wrap.innerHTML = "";
  Object.keys(PALETTES).forEach(function(key){
    var pal = PALETTES[key];
    var btn = document.createElement('button');
    btn.className = 'pal-btn' + (key === state.paletteKey ? ' active' : '');
    var dotsHtml = '<span class="pal-dots">';
    pal.colors.slice(0,4).forEach(function(c){
      dotsHtml += '<i style="background:'+c+'"></i>';
    });
    dotsHtml += '</span>';
    btn.innerHTML = dotsHtml + '<span>' + pal.name + '</span>';
    btn.addEventListener('click', function(){
      state.paletteKey = key;
      state.rows.forEach(r => r.color = null);
      renderAll(); 
    });
    wrap.appendChild(btn);
  });
}

function paintDonut(ctx, size, opts){
  opts = opts || {};
  var cx = size/2, cy = size/2;
  
  // 修正箇所：スマホで見切れないよう、ドーナツのサイズを小さくして余白を確保
  var outerR = size * 0.27; 
  var innerR = outerR * 0.58;
  var labelR = outerR * 1.16;
  var lineR  = outerR * 1.03;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, size, size);

  var total = state.rows.reduce(function(s,r){ return s + (r.value>0?r.value:0); }, 0);

  if(total <= 0){
    ctx.beginPath();
    ctx.arc(cx,cy,outerR,0,Math.PI*2);
    ctx.arc(cx,cy,innerR,0,Math.PI*2,true);
    ctx.fillStyle = "#e3e6db";
    ctx.fill('evenodd');
    ctx.fillStyle = "#8f9a8f";
    ctx.font = (size*0.026)+"px 'JetBrains Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText("データを入力してください", cx, cy+innerR+size*0.06);
    return;
  }

  var startAngle = -Math.PI/2;
  var gap = 0.02;
  var segs = [];

  state.rows.forEach(function(r, i){
    if(r.value <= 0) return;
    var frac = r.value/total;
    var angle = frac * Math.PI*2;
    var a0 = startAngle + gap/2;
    var a1 = startAngle + angle - gap/2;
    if(a1 < a0) a1 = a0;
    var color = r.color || colorForIndex(i);

    ctx.beginPath();
    ctx.arc(cx,cy,outerR,a0,a1);
    ctx.arc(cx,cy,innerR,a1,a0,true);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();

    segs.push({ r:r, a0:a0, a1:a1, frac:frac, color:color, mid:(a0+a1)/2 });
    startAngle += angle;
  });

  var bigThreshold = 0.15;
  var smallSegs = [];

  segs.forEach(function(seg){
    var mid = seg.mid;
    if(seg.frac >= bigThreshold){
      var mr = (outerR+innerR)/2;
      var lx = cx + Math.cos(mid)*mr;
      var ly = cy + Math.sin(mid)*mr;
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      var nameSize = size*0.021;
      var pctSize = size*0.03;
      var outline = Math.max(2, size*0.005);
      function strokedFill(txt, x, y){
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = outline;
        ctx.strokeText(txt, x, y);
        ctx.fillStyle = "#1c2620";
        ctx.fillText(txt, x, y);
      }
      if(opts.showLabel && opts.showPercent){
        ctx.font = "500 "+nameSize+"px 'JetBrains Mono', monospace";
        strokedFill(seg.r.label || '無題', lx, ly-pctSize*0.6);
        ctx.font = "700 "+pctSize+"px 'Space Grotesk', sans-serif";
        strokedFill(Math.round(seg.frac*100)+"%", lx, ly+pctSize*0.5);
      } else if(opts.showPercent){
        ctx.font = "700 "+pctSize+"px 'Space Grotesk', sans-serif";
        strokedFill(Math.round(seg.frac*100)+"%", lx, ly);
      } else if(opts.showLabel){
        ctx.font = "500 "+nameSize+"px 'JetBrains Mono', monospace";
        strokedFill(seg.r.label || '無題', lx, ly);
      }
      ctx.restore();
    } else if(opts.showLabel || opts.showPercent){
      smallSegs.push(seg);
    }
  });

  var leftList = smallSegs.filter(function(s){ return Math.cos(s.mid) < 0; }).sort(function(a,b){ return Math.sin(a.mid) - Math.sin(b.mid); });
  var rightList = smallSegs.filter(function(s){ return Math.cos(s.mid) >= 0; }).sort(function(a,b){ return Math.sin(a.mid) - Math.sin(b.mid); });

  function placeLeaderLabels(list, side){
    var n = list.length;
    if(n===0) return;
    
    var stepY = size * 0.085;
    var avgY = list.reduce(function(sum, s){ return sum + cy + Math.sin(s.mid)*labelR; }, 0) / n;
    var blockTop = avgY - ((n - 1) * stepY) / 2;

    list.forEach(function(seg, i){
      var startX = cx + Math.cos(seg.mid)*lineR;
      var startY = cy + Math.sin(seg.mid)*lineR;
      var targetY = blockTop + i * stepY;
      
      var elbowX = side === 'right' ? cx + labelR*0.8 : cx - labelR*0.8;
      
      // 修正箇所：文字がキャンバスの端にぶつからないよう、描画位置を少し内側へ移動
      var endX = side === 'right' ? size * 0.92 : size * 0.08;

      ctx.save();
      ctx.strokeStyle = seg.color;
      ctx.lineWidth = Math.max(1.5, size*0.0022);
      ctx.beginPath();
      ctx.moveTo(startX,startY);
      ctx.lineTo(elbowX, targetY);
      ctx.lineTo(endX, targetY);
      ctx.stroke();

      ctx.fillStyle = seg.color;
      ctx.beginPath();
      ctx.arc(startX,startY, size*0.007, 0, Math.PI*2);
      ctx.fill();

      var namePart = opts.showLabel ? (seg.r.label || '無題') : "";
      var pctPart = opts.showPercent ? Math.round(seg.frac*100)+"%" : "";

      ctx.textBaseline = "middle";
      ctx.textAlign = side==='right' ? 'right' : 'left';
      var textX = side==='right' ? endX-size*0.012 : endX+size*0.012;

      if(namePart && pctPart){
        ctx.font = "700 "+(size*0.024)+"px 'Space Grotesk', sans-serif";
        ctx.fillStyle = seg.color;
        ctx.fillText(pctPart, textX, targetY - size*0.013);
        ctx.font = "500 "+(size*0.018)+"px 'JetBrains Mono', monospace";
        ctx.fillStyle = "#1c2620";
        ctx.fillText(namePart, textX, targetY + size*0.014);
      } else {
        ctx.font = "700 "+(size*0.024)+"px 'Space Grotesk', sans-serif";
        ctx.fillStyle = pctPart ? seg.color : "#1c2620";
        ctx.fillText(pctPart || namePart, textX, targetY);
      }
      ctx.restore();
    });
  }
  placeLeaderLabels(leftList, 'left');
  placeLeaderLabels(rightList, 'right');

  if(opts.showSub){
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#1c2620";
    var title = state.title || "";
    if(title){
      var titleSize = size*0.033;
      ctx.font = "700 "+titleSize+"px 'Space Grotesk', sans-serif";
      wrapCenterText(ctx, title, cx, cy - size*0.012, innerR*1.7, titleSize*1.15);
    }
    ctx.fillStyle = "#6f7a70";
    ctx.font = (size*0.017)+"px 'JetBrains Mono', monospace";
    var subY = title ? cy + size*0.035 : cy;
    ctx.fillText("n = "+total.toLocaleString('ja-JP'), cx, subY);
    ctx.restore();
  }
}

function wrapCenterText(ctx, text, cx, cy, maxWidth, lineHeight){
  var words = text.split(/(?<=[、,\s])/).length>1 ? text.split(/(?<=[、,\s])/) : text.split("");
  var lines = [];
  var current = "";
  words.forEach(function(w){
    var test = current + w;
    if(ctx.measureText(test).width > maxWidth && current !== ""){
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  });
  if(current) lines.push(current);
  if(lines.length > 3){
    lines = lines.slice(0,3);
    lines[2] = lines[2].slice(0, Math.max(1,lines[2].length-1)) + "…";
  }
  var startY = cy - ((lines.length-1)*lineHeight)/2;
  lines.forEach(function(line, i){
    ctx.fillText(line, cx, startY + i*lineHeight);
  });
}

function drawDonut(){
  var canvas = document.getElementById('chartCanvas');
  var ctx = canvas.getContext('2d');
  var size = 560;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  paintDonut(ctx, size, { showLabel: state.showLabel, showPercent: state.showPercent, showSub: state.showSub });
}

function renderAll(){
  renderRows();
  renderPaletteRow();
  drawDonut();
  saveState();
}

// ボタンイベントの登録
document.getElementById('sortBtn').addEventListener('click', function(){
  // 値が大きい順（降順）にソート
  state.rows.sort(function(a, b){
    return b.value - a.value;
  });
  renderAll();
});

document.getElementById('chartTitle').addEventListener('input', function(e){
  state.title = e.target.value;
  drawDonut();
  saveState();
});

document.getElementById('addRowBtn').addEventListener('click', function(){
  state.rows.push({ id: uid(), label:"", value:0, color:null });
  renderAll();
});

document.getElementById('showLabelChk').addEventListener('change', function(e){
  state.showLabel = e.target.checked;
  drawDonut();
  saveState();
});
document.getElementById('showPercentChk').addEventListener('change', function(e){
  state.showPercent = e.target.checked;
  drawDonut();
  saveState();
});
document.getElementById('showSubChk').addEventListener('change', function(e){
  state.showSub = e.target.checked;
  drawDonut();
  saveState();
});

// 初期化
loadState();
document.getElementById('chartTitle').value = state.title;
renderAll();
</script>
</body>
</html>
