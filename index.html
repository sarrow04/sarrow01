<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グラフジェネレーター2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #eceee6;
    --surface: #ffffff;
    --ink: #1c2620;
    --ink-soft: #6f7a70;
    --line: #d6dacd;
    --accent: #ff6b45;
    --accent-soft: rgba(255,107,69,0.10);
    --teal: #2f6f5e;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    padding:36px 18px 80px;
  }
  .wrap{ max-width:960px; margin:0 auto; }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:10px;
  }
  header h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .tag{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.08em;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1.25fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }

  .panel-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    margin:0 0 16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-title .n{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--ink);
    color:var(--bg);
    font-size:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
  }

  .title-field{ margin-bottom:18px; }
  .title-field label{
    display:block;
    font-size:10px;
    letter-spacing:.1em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .title-field input{
    width:100%;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
  }
  .title-field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  #rows{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .row{
    display:grid;
    grid-template-columns:24px 1fr 78px 30px 22px;
    align-items:center;
    gap:8px;
    padding:7px 8px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .row .idx{ font-size:10px; color:var(--ink-soft); text-align:center; }
  .row input[type=text], .row input[type=number]{
    font-family:'JetBrains Mono', monospace;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:4px 2px;
    font-size:13px;
    color:var(--ink);
    width:100%;
  }
  .row input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .row .swatch{
    width:18px;height:18px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,0.2);
    cursor:pointer;
    padding:0;
    appearance:none;
    -webkit-appearance:none;
    background:none;
  }
  .row .swatch::-webkit-color-swatch-wrapper{ padding:0; }
  .row .swatch::-webkit-color-swatch{ border-radius:50%; border:none; }
  .row .del{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); font-size:15px; line-height:1;
  }
  .row .del:hover{ color:var(--accent); }

  .add-row{
    width:100%;
    padding:10px;
    background:none;
    border:1.5px dashed var(--line);
    border-radius:8px;
    color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.06em;
    cursor:pointer;
    margin-bottom:20px;
  }
  .add-row:hover{ border-color:var(--accent); color:var(--accent); }

  .field-label{ font-size:10px; color:var(--ink-soft); letter-spacing:.1em; margin-bottom:8px; display:block; }
  .palette-picks{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .pal-btn{
    border:1px solid var(--line);
    background:var(--bg);
    border-radius:8px;
    padding:6px 10px;
    font-size:10px;
    letter-spacing:.04em;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--ink-soft);
  }
  .pal-btn.active{ border-color:var(--ink); color:var(--ink); background:var(--surface); }
  .pal-dots{ display:flex; }
  .pal-dots i{ width:8px;height:8px;border-radius:50%;margin-left:-2px; display:inline-block; border:1px solid rgba(0,0,0,0.12); }

  .toggle-line{ display:flex; align-items:center; gap:18px; font-size:11px; color:var(--ink-soft); flex-wrap:wrap; }
  .toggle-line label{ display:flex; align-items:center; gap:6px; cursor:pointer; }

  #chartWrap{ display:flex; justify-content:center; padding:6px 0 4px; position:relative; }
  canvas#chartCanvas{ max-width:100%; }

  .actions{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:12px;
    padding:11px 18px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--bg);
    cursor:pointer;
  }
  .btn:hover{ background:#30392f; }
  .btn.accent{ background:var(--accent); color:#fff; }
  .btn.accent:hover{ background:#e85a35; }
  .btn.ghost{ background:none; color:var(--ink); border:1px solid var(--line); }
  .btn.ghost:hover{ border-color:var(--ink); }

  footer{
    text-align:center;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-top:36px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>ドーナツグラフ ジェネレーター</h1>
    <div class="tag">構成比を、そのままシェアできる一枚に。</div>
  </header>

  <div class="grid">

    <!-- LEFT: input -->
    <div class="card">
      <p class="panel-title"><span class="n">1</span>データを入力</p>

      <div class="title-field">
        <label>グラフタイトル（中央に表示）</label>
        <input type="text" id="chartTitle" placeholder="例）採用フロー内訳">
      </div>

      <div id="rows"></div>
      <button class="add-row" id="addRowBtn">＋ 項目を追加</button>

      <div>
        <span class="field-label">配色</span>
        <div class="palette-picks" id="paletteRow"></div>
      </div>
      <div class="toggle-line">
        <label><input type="checkbox" id="showLabelChk" checked>項目名を表示</label>
        <label><input type="checkbox" id="showPercentChk" checked>％を表示</label>
        <label><input type="checkbox" id="showSubChk" checked>中央に合計を表示</label>
      </div>
    </div>

    <!-- RIGHT: chart -->
    <div class="card">
      <p class="panel-title"><span class="n">2</span>プレビュー</p>
      <div id="chartWrap">
        <canvas id="chartCanvas" width="560" height="560"></canvas>
      </div>
      <div class="actions">
        <button class="btn accent" id="downloadBtn">PNGでダウンロード</button>
        <button class="btn ghost" id="sampleBtn">サンプルを見る</button>
      </div>
    </div>

  </div>

  <footer>データ探偵事務所 — 単一HTMLファイル / オフライン動作 / データはブラウザ内にのみ保存</footer>
</div>

<script>
var PALETTES = {
  "ember":  { name:"EMBER",   colors:["#ff6b45","#ffb26b","#2f6f5e","#1c2620","#c9a24b","#7a8f7f"] },
  "sage":   { name:"SAGE",    colors:["#2f6f5e","#7a9e8e","#c9a24b","#1c2620","#ff6b45","#9fb3a6"] },
  "cobalt": { name:"COBALT",  colors:["#2e4a72","#5b7fa6","#ff6b45","#1c2620","#8fa8c2","#c9a24b"] },
  "berry":  { name:"BERRY",   colors:["#8a3a5c","#c26b8a","#2f6f5e","#1c2620","#e0a4b8","#ff6b45"] },
  "mono":   { name:"MONO",    colors:["#1c2620","#465147","#6f7a70","#9aa495","#c3cbb8","#dfe3d5"] }
};

var state = {
  title: "",
  rows: [],
  paletteKey: "ember",
  showLabel: true,
  showPercent: true,
  showSub: true
};

var STORE_KEY = "donutReportData_v2";

function uid(){ return Math.random().toString(36).slice(2,9); }

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && parsed.rows && parsed.rows.length){
        state.title = parsed.title || "";
        state.rows = parsed.rows;
        state.paletteKey = parsed.paletteKey || "ember";
        state.showLabel = parsed.showLabel !== false;
        state.showPercent = parsed.showPercent !== false;
        state.showSub = parsed.showSub !== false;
        return;
      }
    }
  }catch(e){}
  seedSample();
}

function seedSample(){
  state.title = "採用フロー内訳";
  state.rows = [
    { id: uid(), label:"書類選考", value:120, color:null },
    { id: uid(), label:"一次面接", value:58, color:null },
    { id: uid(), label:"二次面接", value:27, color:null },
    { id: uid(), label:"内定", value:9, color:null }
  ];
}

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){}
}

function colorForIndex(i){
  var pal = PALETTES[state.paletteKey].colors;
  return pal[i % pal.length];
}

function renderRows(){
  var wrap = document.getElementById('rows');
  wrap.innerHTML = "";
  for(var i=0;i<state.rows.length;i++){
    (function(i){
      var r = state.rows[i];
      var div = document.createElement('div');
      div.className = 'row';

      var idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = String(i+1).padStart(2,'0');

      var labelInput = document.createElement('input');
      labelInput.type = 'text';
      labelInput.placeholder = '項目名';
      labelInput.value = r.label;
      labelInput.addEventListener('input', function(){
        r.label = labelInput.value;
        renderAll();
      });

      var valInput = document.createElement('input');
      valInput.type = 'number';
      valInput.placeholder = '数値';
      valInput.value = r.value;
      valInput.min = 0;
      valInput.addEventListener('input', function(){
        r.value = parseFloat(valInput.value) || 0;
        renderAll();
      });

      var colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.className = 'swatch';
      colorInput.value = r.color || colorForIndex(i);
      colorInput.addEventListener('input', function(){
        r.color = colorInput.value;
        renderAll();
      });

      var delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', function(){
        state.rows.splice(i,1);
        renderAll();
      });

      div.appendChild(idx);
      div.appendChild(labelInput);
      div.appendChild(valInput);
      div.appendChild(colorInput);
      div.appendChild(delBtn);
      wrap.appendChild(div);
    })(i);
  }
}

function renderPaletteRow(){
  var wrap = document.getElementById('paletteRow');
  wrap.innerHTML = "";
  Object.keys(PALETTES).forEach(function(key){
    var pal = PALETTES[key];
    var btn = document.createElement('button');
    btn.className = 'pal-btn' + (key === state.paletteKey ? ' active' : '');
    var dotsHtml = '<span class="pal-dots">';
    pal.colors.slice(0,4).forEach(function(c){
      dotsHtml += '<i style="background:'+c+'"></i>';
    });
    dotsHtml += '</span>';
    btn.innerHTML = dotsHtml + '<span>' + pal.name + '</span>';
    btn.addEventListener('click', function(){
      state.paletteKey = key;
      renderAll();
    });
    wrap.appendChild(btn);
  });
}

// Core draw routine, reusable for both on-screen canvas and export canvas.
function paintDonut(ctx, size, opts){
  opts = opts || {};
  var cx = size/2, cy = size/2;
  var outerR = size*0.33;
  var innerR = outerR*0.58;
  var labelR = outerR*1.16;   // where leader lines terminate
  var lineR  = outerR*1.03;   // where leader lines start

  ctx.clearRect(0,0,size,size);

  var total = state.rows.reduce(function(s,r){ return s + (r.value>0?r.value:0); }, 0);

  if(total <= 0){
    ctx.beginPath();
    ctx.arc(cx,cy,outerR,0,Math.PI*2);
    ctx.arc(cx,cy,innerR,0,Math.PI*2,true);
    ctx.fillStyle = "#e3e6db";
    ctx.fill('evenodd');
    ctx.fillStyle = "#8f9a8f";
    ctx.font = (size*0.026)+"px 'JetBrains Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText("データを入力してください", cx, cy+innerR+size*0.06);
    return;
  }

  var startAngle = -Math.PI/2;
  var gap = 0.02;
  var segs = [];

  state.rows.forEach(function(r, i){
    if(r.value <= 0) return;
    var frac = r.value/total;
    var angle = frac * Math.PI*2;
    var a0 = startAngle + gap/2;
    var a1 = startAngle + angle - gap/2;
    if(a1 < a0) a1 = a0;
    var color = r.color || colorForIndex(i);

    ctx.beginPath();
    ctx.arc(cx,cy,outerR,a0,a1);
    ctx.arc(cx,cy,innerR,a1,a0,true);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();

    segs.push({ r:r, a0:a0, a1:a1, frac:frac, color:color, mid:(a0+a1)/2 });
    startAngle += angle;
  });

  // in-segment labels for large-enough slices; leader-line labels for small ones
  var bigThreshold = 0.10;
  var smallSegs = [];

  segs.forEach(function(seg){
    var mid = seg.mid;
    if(seg.frac >= bigThreshold){
      var mr = (outerR+innerR)/2;
      var lx = cx + Math.cos(mid)*mr;
      var ly = cy + Math.sin(mid)*mr;
      ctx.save();
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      var nameSize = size*0.021;
      var pctSize = size*0.026;
      var yOff = 0;
      if(opts.showLabel && opts.showPercent){
        ctx.font = "500 "+nameSize+"px 'JetBrains Mono', monospace";
        ctx.fillText(seg.r.label || '無題', lx, ly-pctSize*0.55);
        ctx.font = "700 "+pctSize+"px 'Space Grotesk', sans-serif";
        ctx.fillText(Math.round(seg.frac*100)+"%", lx, ly+pctSize*0.55);
      } else if(opts.showPercent){
        ctx.font = "700 "+pctSize+"px 'Space Grotesk', sans-serif";
        ctx.fillText(Math.round(seg.frac*100)+"%", lx, ly);
      } else if(opts.showLabel){
        ctx.font = "500 "+nameSize+"px 'JetBrains Mono', monospace";
        ctx.fillText(seg.r.label || '無題', lx, ly);
      }
      ctx.restore();
    } else if(opts.showLabel || opts.showPercent){
      smallSegs.push(seg);
    }
  });

  // leader-line labels for small slices, split left/right to avoid overlap
  var leftList = smallSegs.filter(function(s){ return Math.cos(s.mid) < 0; }).sort(function(a,b){ return a.mid-b.mid; });
  var rightList = smallSegs.filter(function(s){ return Math.cos(s.mid) >= 0; }).sort(function(a,b){ return a.mid-b.mid; });

  function placeLeaderLabels(list, side){
    var n = list.length;
    if(n===0) return;
    var topY = cy - outerR*0.86;
    var botY = cy + outerR*0.86;
    var stepY = n>1 ? (botY-topY)/(n-1) : 0;
    list.forEach(function(seg, i){
      var startX = cx + Math.cos(seg.mid)*lineR;
      var startY = cy + Math.sin(seg.mid)*lineR;
      var targetY = n>1 ? topY + stepY*i : cy + Math.sin(seg.mid)*labelR;
      var elbowX = cx + Math.cos(seg.mid)*labelR;
      var endX = side==='right' ? size*0.965 : size*0.035;

      ctx.save();
      ctx.strokeStyle = seg.color;
      ctx.lineWidth = Math.max(1, size*0.0018);
      ctx.beginPath();
      ctx.moveTo(startX,startY);
      ctx.lineTo(elbowX, targetY);
      ctx.lineTo(endX, targetY);
      ctx.stroke();

      ctx.fillStyle = seg.color;
      ctx.beginPath();
      ctx.arc(startX,startY, size*0.006, 0, Math.PI*2);
      ctx.fill();

      var txt = "";
      if(opts.showLabel) txt += (seg.r.label || '無題');
      if(opts.showLabel && opts.showPercent) txt += "  ";
      if(opts.showPercent) txt += Math.round(seg.frac*100)+"%";

      ctx.fillStyle = "#1c2620";
      ctx.font = "500 "+(size*0.019)+"px 'JetBrains Mono', monospace";
      ctx.textBaseline = "middle";
      ctx.textAlign = side==='right' ? 'right' : 'left';
      var textX = side==='right' ? endX-size*0.012 : endX+size*0.012;
      ctx.fillText(txt, textX, targetY);
      ctx.restore();
    });
  }
  placeLeaderLabels(leftList, 'left');
  placeLeaderLabels(rightList, 'right');

  // center title / total
  if(opts.showSub){
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#1c2620";
    var title = state.title || "";
    if(title){
      var titleSize = size*0.033;
      ctx.font = "700 "+titleSize+"px 'Space Grotesk', sans-serif";
      wrapCenterText(ctx, title, cx, cy - size*0.012, innerR*1.7, titleSize*1.15);
    }
    ctx.fillStyle = "#6f7a70";
    ctx.font = (size*0.017)+"px 'JetBrains Mono', monospace";
    var subY = title ? cy + size*0.035 : cy;
    ctx.fillText("n = "+total.toLocaleString('ja-JP'), cx, subY);
    ctx.restore();
  }
}

function wrapCenterText(ctx, text, cx, cy, maxWidth, lineHeight){
  var words = text.split(/(?<=[、,\s])/).length>1 ? text.split(/(?<=[、,\s])/) : text.split("");
  var lines = [];
  var current = "";
  words.forEach(function(w){
    var test = current + w;
    if(ctx.measureText(test).width > maxWidth && current !== ""){
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  });
  if(current) lines.push(current);
  if(lines.length > 3){
    lines = lines.slice(0,3);
    lines[2] = lines[2].slice(0, Math.max(1,lines[2].length-1)) + "…";
  }
  var startY = cy - ((lines.length-1)*lineHeight)/2;
  lines.forEach(function(line, i){
    ctx.fillText(line, cx, startY + i*lineHeight);
  });
}

function drawDonut(){
  var canvas = document.getElementById('chartCanvas');
  var ctx = canvas.getContext('2d');
  var size = 560;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  paintDonut(ctx, size, { showLabel: state.showLabel, showPercent: state.showPercent, showSub: state.showSub });
}

function renderAll(){
  renderRows();
  renderPaletteRow();
  drawDonut();
  saveState();
}

document.getElementById('chartTitle').addEventListener('input', function(e){
  state.title = e.target.value;
  renderAll();
});

document.getElementById('addRowBtn').addEventListener('click', function(){
  state.rows.push({ id: uid(), label:"", value:0, color:null });
  renderAll();
});

document.getElementById('showLabelChk').addEventListener('change', function(e){
  state.showLabel = e.target.checked;
  renderAll();
});
document.getElementById('showPercentChk').addEventListener('change', function(e){
  state.showPercent = e.target.checked;
  renderAll();
});
document.getElementById('showSubChk').addEventListener('change', function(e){
  state.showSub = e.target.checked;
  renderAll();
});

document.getElementById('sampleBtn').addEventListener('click', function(){
  seedSample();
  document.getElementById('chartTitle').value = state.title;
  renderAll();
});

document.getElementById('downloadBtn').addEventListener('click', function(){
  var exportSize = 1200;
  var out = document.createElement('canvas');
  out.width = exportSize;
  out.height = exportSize;
  var octx = out.getContext('2d');
  octx.fillStyle = "#ffffff";
  octx.fillRect(0,0,exportSize,exportSize);
  paintDonut(octx, exportSize, { showLabel: state.showLabel, showPercent: state.showPercent, showSub: state.showSub });

  var link = document.createElement('a');
  link.download = (state.title ? state.title.replace(/[\\/:*?"<>|]/g,'') : 'donut-chart') + '.png';
  link.href = out.toDataURL('image/png');
  link.click();
});

// init
loadState();
document.getElementById('chartTitle').value = state.title;
renderAll();
</script>
</body>
</html>
